name: Build and publish OrangeFox rodin

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: Create a prerelease with vendor_boot images
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: orangefox-rodin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ORANGEFOX_BRANCH: '14.1'
  ORANGEFOX_SYNC_REVISION: '11e4406b2bd1de939a26b6bfbad7e371cc3b1fa7'
  ORANGEFOX_TOP: ${{ github.workspace }}/OrangeFox
  OF_BUILD_JOBS: '1'

jobs:
  build:
    # Hosted image layouts vary. The first steps reclaim unrelated payloads,
    # then verify the observed capacity before building at low concurrency.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        firmware_variant: [cn, global]
    env:
      RODIN_FIRMWARE_VARIANT: ${{ matrix.firmware_variant }}

    steps:
      - name: Check out device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: device-tree

      - name: Set build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          case "${RODIN_FIRMWARE_VARIANT}" in
            cn)
              image_name="OrangeFox-R12.0-Unofficial-rodin-system-compatible.img"
              disable_avb_image_name="OrangeFox-R12.0-Unofficial-rodin-disable-avb-system-compatible.img"
              firmware_baseline="CN OS3.0.303.0.WOJCNXM"
              ;;
            global)
              image_name="OrangeFox-R12.0-Unofficial-rodin-global-system-compatible.img"
              disable_avb_image_name="OrangeFox-R12.0-Unofficial-rodin-global-disable-avb-system-compatible.img"
              firmware_baseline="Global OS3.0.301.0.WOJMIXM"
              ;;
            *)
              echo "Unsupported RODIN_FIRMWARE_VARIANT: ${RODIN_FIRMWARE_VARIANT}" >&2
              exit 1
              ;;
          esac

          echo "artifact_name=orangefox-rodin-release-${RODIN_FIRMWARE_VARIANT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "firmware_baseline=${firmware_baseline}" >> "$GITHUB_OUTPUT"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "disable_avb_image_name=${disable_avb_image_name}" >> "$GITHUB_OUTPUT"

      - name: Remove stale build worktree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ORANGEFOX_TOP" \
            "$GITHUB_WORKSPACE/ofox-sync" \
            "$GITHUB_WORKSPACE/pinned-manifest" \
            "$GITHUB_WORKSPACE/artifacts"
          rm -f "$GITHUB_WORKSPACE/ci-gitconfig" \
            "$GITHUB_WORKSPACE/orangefox-build.log"

      # This is the cleaner used by Klee's known-working hosted workflow.
      # It removes substantially more hosted-image payload than apt cleanup.
      - name: Free disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Install host packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lz4 openjdk-17-jdk-headless pngcrush \
            python-is-python3 python3 ripgrep rsync schedtool squashfs-tools \
            unzip xsltproc zip zlib1g-dev
          sudo apt-get clean
          java_home="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          test -x "${java_home}/bin/java"
          echo "JAVA_HOME=${java_home}" >> "$GITHUB_ENV"

      - name: Fetch device blobs
        shell: bash
        run: |
          set -euo pipefail
          git -C "$GITHUB_WORKSPACE/device-tree" lfs pull
          git -C "$GITHUB_WORKSPACE/device-tree" lfs fsck
          test -s "$GITHUB_WORKSPACE/device-tree/prebuilt/vendor_boot_stock.img"
          if grep -aqF 'version https://git-lfs.github.com/spec/v1' \
            "$GITHUB_WORKSPACE/device-tree/prebuilt/vendor_boot_stock.img"; then
            echo "::error::Git LFS did not materialize prebuilt/vendor_boot_stock.img."
            exit 1
          fi

      - name: Setup build swap
        shell: bash
        run: |
          set -euo pipefail
          # setup-swap.sh creates only the missing capacity plus a header margin.
          MIN_SWAP_GIB=12 \
            bash "$GITHUB_WORKSPACE/device-tree/.github/scripts/setup-swap.sh"

      - name: Check runner capacity
        shell: bash
        run: |
          set -euo pipefail

          available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')"
          required_kib=$((95 * 1024 * 1024))
          if [[ -z "${available_kib}" || "${available_kib}" -lt "${required_kib}" ]]; then
            available_gib=$((available_kib / 1024 / 1024))
            echo "::error::OrangeFox rodin needs at least 95 GiB free after hosted-image cleanup and swap setup; found ${available_gib} GiB."
            echo "::error::Use a GitHub-hosted larger runner if this public standard runner image cannot meet the guard."
            exit 1
          fi

          memory_kib="$(awk '/^MemTotal:/ { print $2 }' /proc/meminfo)"
          required_memory_kib=$((14 * 1024 * 1024))
          if [[ -z "${memory_kib}" || "${memory_kib}" -lt "${required_memory_kib}" ]]; then
            memory_gib=$((memory_kib / 1024 / 1024))
            echo "::error::This workflow needs a public 16 GB-class GitHub-hosted runner; found ${memory_gib} GiB RAM."
            exit 1
          fi

          df -h "$GITHUB_WORKSPACE"
          free -h

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail
          install -d "$HOME/bin"
          curl --fail --location --retry 5 --retry-all-errors \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync OrangeFox sources
        shell: bash
        run: |
          set -euo pipefail

          manifest_repo="$GITHUB_WORKSPACE/pinned-manifest"
          export GIT_CONFIG_GLOBAL="$GITHUB_WORKSPACE/ci-gitconfig"
          mkdir -p "$manifest_repo"
          cp "$GITHUB_WORKSPACE/device-tree/manifests/orangefox-fox_14.1-pinned.xml" \
            "$manifest_repo/default.xml"
          git -C "$manifest_repo" init --initial-branch=main --quiet
          git -C "$manifest_repo" config user.name "OrangeFox CI"
          git -C "$manifest_repo" config user.email "orangefox-ci@localhost"
          git -C "$manifest_repo" add default.xml
          git -C "$manifest_repo" commit --quiet -m "Pinned OrangeFox 14.1 manifest"
          git config --global protocol.file.allow always
          # GitLab occasionally resets long HTTP/2 fetches from hosted runners.
          # Keep the transport reproducible and tolerate slow pack transfers.
          # git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 1
          git config --global http.lowSpeedTime 600

          mkdir -p "$ORANGEFOX_TOP"
          cd "$ORANGEFOX_TOP"
          repo init --depth=1 \
            -u "file://${manifest_repo}" \
            -b main \
            -m default.xml

          (
            while sleep 60; do
              date -u '+%Y-%m-%dT%H:%M:%SZ sync heartbeat'
              df -h "$GITHUB_WORKSPACE"
              free -h
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT

          sync_succeeded=0
          for sync_attempt in 1 2 3; do
            if repo sync -c -j4 --retry-fetches=3 \
              --no-clone-bundle --no-tags --optimized-fetch; then
              sync_succeeded=1
              break
            fi

            if [[ "$sync_attempt" -lt 3 ]]; then
              delay_seconds=$((sync_attempt * 20))
              echo "::warning::OrangeFox source sync attempt ${sync_attempt} failed; retrying in ${delay_seconds}s."
              sleep "$delay_seconds"
            fi
          done
          if [[ "$sync_succeeded" -ne 1 ]]; then
            echo "::error::OrangeFox source sync failed after three complete attempts." >&2
            exit 1
          fi

          kill "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT

      - name: Apply OrangeFox setup patches
        shell: bash
        run: |
          set -euo pipefail

          sync_dir="$GITHUB_WORKSPACE/ofox-sync"
          git clone --filter=blob:none https://gitlab.com/OrangeFox/sync.git "$sync_dir"
          git -C "$sync_dir" checkout --detach "$ORANGEFOX_SYNC_REVISION"
          test "$(git -C "$sync_dir" rev-parse HEAD)" = "$ORANGEFOX_SYNC_REVISION"

          vold_patch="$sync_dir/patches/patch-vold-fox_14.1.diff"
          test "$(sha256sum "$vold_patch" | awk '{print $1}')" = \
            "29b4b0b387c3185a3dcc69f141a3c84969510547d13ed2de71eefa8423c57778"
          if git -C "$ORANGEFOX_TOP/system/vold" apply --reverse --check "$vold_patch" 2>/dev/null; then
            echo "OrangeFox system/vold patch is already applied"
          else
            git -C "$ORANGEFOX_TOP/system/vold" apply --check "$vold_patch"
            git -C "$ORANGEFOX_TOP/system/vold" apply "$vold_patch"
          fi

          boardconfig="$ORANGEFOX_TOP/vendor/twrp/config/BoardConfigSoong.mk"
          grep -qx 'include bootable/recovery/orangefox_soong.mk' "$boardconfig" || \
            sed -i '/SOONG_CONFIG_NAMESPACES += twrpVarsPlugin/i include bootable/recovery/orangefox_soong.mk' \
              "$boardconfig"

      - name: Install rodin device tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ORANGEFOX_TOP/device/xiaomi/rodin"
          rsync -a --delete \
            --exclude .git \
            --exclude images \
            "$GITHUB_WORKSPACE/device-tree/" \
            "$ORANGEFOX_TOP/device/xiaomi/rodin/"

      - name: Apply source patches & verify
        shell: bash
        run: |
          set -euo pipefail
          "$ORANGEFOX_TOP/device/xiaomi/rodin/tools/apply-orangefox-patches.sh" \
            "$ORANGEFOX_TOP"

      - name: Drop sync metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ORANGEFOX_TOP/.repo" \
            "$GITHUB_WORKSPACE/ofox-sync" \
            "$GITHUB_WORKSPACE/pinned-manifest" \
            "$GITHUB_WORKSPACE/ci-gitconfig"
          df -h "$GITHUB_WORKSPACE"
          free -h

      - name: Check compilation capacity
        shell: bash
        run: |
          set -euo pipefail

          # slimhub reclaims about 138 GiB on the standard hosted image. A
          # full pinned source checkout leaves about 45 GiB after .repo is
          # removed; this low-memory, single-job build requires a 35 GiB floor
          # before Soong starts writing out/.
          available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')"
          required_kib=$((35 * 1024 * 1024))
          if [[ -z "${available_kib}" || "${available_kib}" -lt "${required_kib}" ]]; then
            available_gib=$((available_kib / 1024 / 1024))
            echo "::error::OrangeFox rodin needs at least 35 GiB free after .repo cleanup; found ${available_gib} GiB."
            exit 1
          fi

          du -sh "$ORANGEFOX_TOP"
          df -h "$GITHUB_WORKSPACE"

      - name: Build vendor_boot image
        shell: bash
        working-directory: ${{ env.ORANGEFOX_TOP }}
        env:
          ALLOW_MISSING_DEPENDENCIES: 'true'
          FOX_BUILD_DEVICE: rodin
          FOX_AB_DEVICE: '1'
          FOX_VIRTUAL_AB_DEVICE: '1'
          OF_FORCE_PREBUILT_KERNEL: '1'
          OF_LOW_MEMORY_BUILD: '1'
          GOMEMLIMIT: '3GiB'
          GOGC: '20'
          _JAVA_OPTIONS: '-Xmx3g'
          USE_CCACHE: '0'
        run: |
          set -euo pipefail
          build_jobs="$(nproc)"
          export OF_BUILD_JOBS="$build_jobs"
          export NINJA_ARGS="-j${build_jobs} -l${build_jobs}"
          export SOONG_UI_NINJA_ARGS="$NINJA_ARGS"
          printf 'Using %s Ninja jobs\n' "$build_jobs"

          (
            while sleep 60; do
              date -u '+%Y-%m-%dT%H:%M:%SZ build heartbeat'
              df -h "$GITHUB_WORKSPACE"
              free -h
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT

          device/xiaomi/rodin/build-lowmem.sh vendorbootimage 2>&1 | \
            tee "$GITHUB_WORKSPACE/orangefox-build.log"

          kill "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT

      - name: Validate release image
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.metadata.outputs.image_name }}
          DISABLE_AVB_IMAGE_NAME: ${{ steps.metadata.outputs.disable_avb_image_name }}
        run: |
          set -euo pipefail
          product="$ORANGEFOX_TOP/out/target/product/rodin"
          image="$product/$IMAGE_NAME"
          disable_avb_image="$product/$DISABLE_AVB_IMAGE_NAME"
          avbtool="$ORANGEFOX_TOP/out/host/linux-x86/bin/avbtool"

          test -f "$image"
          test -f "${image}.sha256"
          test -f "$disable_avb_image"
          test -f "${disable_avb_image}.sha256"
          test -x "$avbtool"
          test "$(stat -c %s "$image")" = "67108864"
          test "$(stat -c %s "$disable_avb_image")" = "67108864"
          sha256sum --check --strict "${image}.sha256"
          sha256sum --check --strict "${disable_avb_image}.sha256"
          test -f "$product/vendor_boot.img"
          cmp -s "$image" "$product/vendor_boot.img"
          "$avbtool" verify_image --image "$image"

          # AVB descriptors name the partition vendor_boot. Validate the
          # alternate image through that filename so avbtool hashes this image,
          # not the standard product/vendor_boot.img alias.
          avb_validation_dir="$(mktemp -d)"
          trap 'rm -rf "$avb_validation_dir"' EXIT
          ln -s "$disable_avb_image" "$avb_validation_dir/vendor_boot.img"
          "$avbtool" verify_image --image "$avb_validation_dir/vendor_boot.img"

      - name: Collect release artifact
        shell: bash
        env:
          FIRMWARE_BASELINE: ${{ steps.metadata.outputs.firmware_baseline }}
          IMAGE_NAME: ${{ steps.metadata.outputs.image_name }}
          DISABLE_AVB_IMAGE_NAME: ${{ steps.metadata.outputs.disable_avb_image_name }}
        run: |
          set -euo pipefail
          product="$ORANGEFOX_TOP/out/target/product/rodin"
          image="$product/$IMAGE_NAME"
          disable_avb_image="$product/$DISABLE_AVB_IMAGE_NAME"

          rm -rf "$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp -fp "$image" "$GITHUB_WORKSPACE/artifacts/$IMAGE_NAME"
          cp -fp "$disable_avb_image" "$GITHUB_WORKSPACE/artifacts/$DISABLE_AVB_IMAGE_NAME"
          (
            cd "$GITHUB_WORKSPACE/artifacts"
            sha256sum "$IMAGE_NAME" > "${IMAGE_NAME}.sha256"
            sha256sum "$DISABLE_AVB_IMAGE_NAME" > "${DISABLE_AVB_IMAGE_NAME}.sha256"
          )

          cat > "$GITHUB_WORKSPACE/artifacts/build-info-${RODIN_FIRMWARE_VARIANT}.md" <<EOF
          Automated OrangeFox ${RODIN_FIRMWARE_VARIANT} build for rodin.

          - Device-tree commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          - OrangeFox branch: ${ORANGEFOX_BRANCH}
          - Firmware profile: ${FIRMWARE_BASELINE}
          - GitHub run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          This artifact contains validated standard and disable-avb system-compatible vendor_boot images.
          EOF

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-rodin-logs-${{ matrix.firmware_variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            orangefox-build.log
            OrangeFox/out/logs
          if-no-files-found: warn
          retention-days: 14

      - name: Clean build worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ORANGEFOX_TOP" \
            "$GITHUB_WORKSPACE/ofox-sync" \
            "$GITHUB_WORKSPACE/pinned-manifest" \
            "$GITHUB_WORKSPACE/artifacts"
          rm -f "$GITHUB_WORKSPACE/ci-gitconfig" \
            "$GITHUB_WORKSPACE/orangefox-build.log"

  release:
    if: ${{ needs.build.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: orangefox-rodin-release-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts
          merge-multiple: true

      - name: Verify images
        shell: bash
        run: |
          set -euo pipefail
          cd release-artifacts
          for image in \
            OrangeFox-R12.0-Unofficial-rodin-system-compatible.img \
            OrangeFox-R12.0-Unofficial-rodin-disable-avb-system-compatible.img \
            OrangeFox-R12.0-Unofficial-rodin-global-system-compatible.img \
            OrangeFox-R12.0-Unofficial-rodin-global-disable-avb-system-compatible.img
          do
            test -f "${image}"
            test -f "${image}.sha256"
            sha256sum --check --strict "${image}.sha256"
          done

      - name: Create prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          release_tag="rodin-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}"
          notes="$GITHUB_WORKSPACE/release-notes.md"
          cat > "$notes" <<EOF
          Automated OrangeFox build for rodin.

          - Device-tree commit: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          - OrangeFox branch: ${ORANGEFOX_BRANCH}
          - CN firmware profile: OS3.0.303.0.WOJCNXM
          - Global firmware profile: OS3.0.301.0.WOJMIXM
          - GitHub run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          This prerelease contains standard and disable-avb system-compatible vendor_boot images for both firmware profiles.
          EOF

          gh release create "$release_tag" \
            "release-artifacts/OrangeFox-R12.0-Unofficial-rodin-system-compatible.img" \
            "release-artifacts/OrangeFox-R12.0-Unofficial-rodin-system-compatible.img.sha256" \
            "release-artifacts/OrangeFox-R12.0-Unofficial-rodin-disable-avb-system-compatible.img" \
            "release-artifacts/OrangeFox-R12.0-Unofficial-rodin-disable-avb-system-compatible.img.sha256" \
            "release-artifacts/OrangeFox-R12.0-Unofficial-rodin-global-system-compatible.img" \
            "release-artifacts/OrangeFox-R12.0-Unofficial-rodin-global-system-compatible.img.sha256" \
            "release-artifacts/OrangeFox-R12.0-Unofficial-rodin-global-disable-avb-system-compatible.img" \
            "release-artifacts/OrangeFox-R12.0-Unofficial-rodin-global-disable-avb-system-compatible.img.sha256" \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "OrangeFox rodin CI ${GITHUB_SHA::7}" \
            --notes-file "$notes" \
            --prerelease
